name: Update stats

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 7am Eastern (6am in winter)
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats from the three servers
        env:
          STATS_URL_KITCHEN: ${{ secrets.STATS_URL_KITCHEN }}
          STATS_URL_WORKOUT: ${{ secrets.STATS_URL_WORKOUT }}
          STATS_URL_FOOD: ${{ secrets.STATS_URL_FOOD_JOURNAL }}
        run: python scripts/update_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stats.json stats-history.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update stats"
            git push
          fi
